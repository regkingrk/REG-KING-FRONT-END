<script>
(function(){try{
  var seen=sessionStorage.getItem('rk:intro-seen')==='1';
  var rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var deep=/[?&]q=/.test(location.search);
  if(!seen&&!rm&&!deep)document.documentElement.classList.add('rk-intro-pending');
}catch(e){document.documentElement.classList.add('rk-intro-pending');}})();

/* Artifact preview only: the host page already pads the top by the safe area, so the body must not add it again */
html body{padding-top:var(--rk-top-h)}

.rk-toast b{color:var(--rk-yellow)}

<script>
/*__BUNDLE__*/
</script>
<script>
(function () {
  var CROWN = __CROWN_JSON__;
  var root = document.documentElement;

  /* Preview: open destinations in a new tab and say what happened. */
  var toastEl;
  function toast(html) {
    if (!toastEl) { toastEl = document.createElement("div"); toastEl.className = "rk-toast"; toastEl.setAttribute("role", "status"); document.body.appendChild(toastEl); }
    toastEl.innerHTML = html; toastEl.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(function () { toastEl.hidden = true; }, 3600);
  }
  window.__RK_NAV__ = function (url, label) {
    var a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    var q = ""; try { q = new URL(url).searchParams.get("reg") || new URL(url).searchParams.get("q") || ""; } catch (e) {}
    q = q.replace(/[<>&"]/g, "");
    toast(label === "build" ? "Opening your <b>" + q + "</b> plate order on regking.co.uk" : label === "sell" ? "Starting an offer for <b>" + q + "</b>" : label === "value" ? "Valuing <b>" + q + "</b>" : "Searching plates for <b>" + q + "</b> on regking.co.uk");
  };

  /* Site links like /privacy-policy live on the real site, not in this preview. */
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest('a[href^="/"]');
    if (!a) return;
    e.preventDefault();
    var path = a.getAttribute("href");
    toast(path === "/" ? "This is the homepage" : "On the live site this opens <b>regking.co.uk" + path.replace(/[<>&"]/g, "") + "</b>");
  });

  var replayBtn = document.getElementById("rk-replay");
  var onScrollReplay = function () { replayBtn.hidden = window.scrollY > 120; };
  window.addEventListener("scroll", onScrollReplay, { passive: true }); onScrollReplay();
  replayBtn.addEventListener("click", function () {
    try { sessionStorage.removeItem("rk:intro-seen"); } catch (e) {}
    location.reload();
  });

  if (!window.React || !window.ReactDOM) { root.classList.remove("rk-intro-pending"); return; }

  /* Tiny CommonJS loader for the bundled app modules. */
  var R = window.React;
  var jsx = function (type, props, key) { return R.createElement(type, key === undefined ? props : Object.assign({}, props, { key: key })); };
  var external = {
    "react": R,
    "react-dom": window.ReactDOM,
    "react/jsx-runtime": { jsx: jsx, jsxs: jsx, Fragment: R.Fragment },
    "three": window.THREE || {},
    "gsap": { gsap: window.gsap, default: window.gsap }
  };
  var cache = {};
  function norm(path) {
    var outp = [];
    path.split("/").forEach(function (seg) { if (seg === "..") outp.pop(); else if (seg && seg !== ".") outp.push(seg); });
    return outp.join("/");
  }
  function load(id) {
    if (cache[id]) return cache[id].exports;
    var fn = __RK_MODS__[id];
    if (!fn) throw new Error("Module not found: " + id);
    var module = { exports: {} };
    cache[id] = module;
    var dir = id.split("/").slice(0, -1).join("/");
    fn(module, module.exports, function (req) {
      if (external[req]) return external[req];
      var base = norm(dir + "/" + req);
      var cands = [base, base + ".js", base + "/index.js"];
      for (var i = 0; i < cands.length; i++) if (__RK_MODS__[cands[i]]) return load(cands[i]);
      throw new Error("Cannot resolve " + req + " from " + id);
    });
    return module.exports;
  }

  // The crown, if supplied, is inlined; the app checks for it with a HEAD request.
  if (CROWN) {
    var f = window.fetch;
    window.fetch = function (u, o) { if (String(u).indexOf("/brand/crown") > -1) return Promise.resolve(new Response("", { status: 200 })); return f.apply(this, arguments); };
    var brand = load("lib/brand.js"); try { brand.assets.crown = CROWN; } catch (e) {}
  } else {
    var f2 = window.fetch;
    window.fetch = function (u, o) { if (String(u).indexOf("/brand/crown") > -1) return Promise.resolve(new Response("", { status: 404 })); return f2.apply(this, arguments); };
  }

  // Preview only: lets the automated checks load a module directly.
  window.__RK_LOAD__ = load;
  var Home = load("__ENTRY__").default;
  var mount = document.getElementById("rk-root");
  ReactDOM.createRoot(mount).render(R.createElement(Home));
})();
</script>
